name: Auto-merge Dependabot PR

on:
  pull_request_target:
    branches: ['master']
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      # Отдаёт разобранные метаданные обновления вместо парсинга заголовка PR:
      # update-type принимает version-update:semver-{major,minor,patch}.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip major update
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "⚠ Major update ($DEP) — auto-merge skipped, merge manually"
        env:
          DEP: ${{ steps.metadata.outputs.dependency-names }}
